-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"excerpt\":\"Sebanyak 60 pengurus KDMP se-Kabupaten Konawe mengikuti pelatihan tata kelola digital, pencatatan keuangan, dan pengelolaan microsite koperasi.\",\"category\":\"Kegiatan\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Humas Dinkopukm Konawe\",\"published_at\":\"2026-10-24T09:00:00.000Z\",\"views\":426},{\"id\":\"f3e65c71-1031-4a66-b03a-92a11570becb\",\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"excerpt\":\"Melalui program PASTI UMKM, pelaku usaha mikro dapat mengikuti sertifikasi halal gratis beserta pendampingan legalitas NIB dan merek.\",\"category\":\"Pengumuman\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Bidang UKM\",\"published_at\":\"2026-10-20T02:30:00.000Z\",\"views\":982},{\"id\":\"a7d33405-7f25-443f-b6a7-9a05e7e8e839\",\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"excerpt\":\"Penilaian kesehatan koperasi mencakup aspek permodalan, kualitas aset, manajemen, efisiensi, likuiditas, dan pertumbuhan usaha.\",\"category\":\"Prestasi\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Humas Dinkopukm Konawe\",\"published_at\":\"2026-10-16T04:15:00.000Z\",\"views\":301}],\"categories\":[\"Kegiatan\",\"Pengumuman\",\"Prestasi\",\"Program\"]}"},"/api/news/pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii":{"status":200,"body":"{\"data\":{\"id\":\"6a70c653-995f-4e17-9408-36be7477c911\",\"slug\":\"pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"excerpt\":\"Sebanyak 60 pengurus KDMP se-Kabupaten Konawe mengikuti pelatihan tata kelola digital, pencatatan keuangan, dan pengelolaan microsite koperasi.\",\"content\":\"Dinas Koperasi dan Usaha Kecil Menengah Kabupaten Konawe kembali menggelar Pelatihan Digitalisasi Koperasi Merah Putih angkatan III di Aula Kantor Dinkopukm Konawe, Unaaha.\\n\\nPelatihan yang berlangsung selama tiga hari ini diikuti 60 pengurus Koperasi Desa/Kelurahan Merah Putih (KDMP) dari 28 kecamatan. Materi yang diberikan meliputi tata kelola keuangan koperasi, pencatatan transaksi digital, hingga pengelolaan microsite koperasi sebagai kanal informasi publik.\\n\\nKepala Dinkopukm Kabupaten Konawe menyampaikan bahwa digitalisasi bukan sekadar penggunaan aplikasi, tetapi perubahan cara koperasi melayani anggota. \\\"Setiap KDMP kita dorong memiliki microsite aktif yang memuat profil, unit usaha, dan laporan perkembangan,\\\" ujarnya.\\n\\nPeserta juga mendapatkan pendampingan langsung untuk mengunggah profil koperasi ke Direktori KDMP pada portal layanan Dinkopukm Konawe. Pelatihan angkatan IV dijadwalkan pada November 2026 dengan sasaran pengurus koperasi sekolah dan koperasi karyawan.\",\"category\":\"Kegiatan\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Humas Dinkopukm Konawe\",\"published_at\":\"2026-10-24T09:00:00.000Z\",\"is_published\":1,\"views\":426},\"related\":[{\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Pengumuman\",\"published_at\":\"2026-10-20T02:30:00.000Z\"},{\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Prestasi\",\"published_at\":\"2026-10-16T04:15:00.000Z\"},{\"slug\":\"bazar-umkm-konawe-bersahaja-2026\",\"title\":\"Bazar UMKM Konawe Bersahaja 2026 Catat Transaksi Rp1,4 Miliar\",\"image_url\":\"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-11T08:45:00.000Z\"}]}"},"/api/news/pendaftaran-sertifikasi-halal-gratis-umkm-konawe":{"status":200,"body":"{\"data\":{\"id\":\"f3e65c71-1031-4a66-b03a-92a11570becb\",\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"excerpt\":\"Melalui program PASTI UMKM, pelaku usaha mikro dapat mengikuti sertifikasi halal gratis beserta pendampingan legalitas NIB dan merek.\",\"content\":\"Dinkopukm Kabupaten Konawe membuka pendaftaran Sertifikasi Halal Gratis (Sehati) bagi 1.200 pelaku usaha mikro se-Kabupaten Konawe. Pendaftaran dibuka hingga 30 November 2026 melalui menu PASTI UMKM pada portal ini.\\n\\nProgram ini merupakan bagian dari skema PASTI UMKM — Panduan Akselerasi Sertifikasi Halal dan Legalitas Terintegrasi bagi UMKM — yang memadukan tiga layanan: sertifikasi halal, penerbitan NIB, dan pendaftaran merek.\\n\\n\\\"UMKM Naik Kelas, Halal Terjamin, Legalitas Aman\\\" menjadi semangat program ini. Pendamping akan mendampingi peserta mulai dari pengisian formulir, verifikasi dokumen, hingga penerbitan sertifikat.\\n\\nSyarat utama: pelaku usaha mikro dengan omzet di bawah Rp2 miliar per tahun, memiliki NIB, dan produk yang didaftarkan tidak mengandung unsur haram. Peserta yang belum memiliki NIB akan difasilitasi penerbitannya secara gratis.\",\"category\":\"Pengumuman\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Bidang UKM\",\"published_at\":\"2026-10-20T02:30:00.000Z\",\"is_published\":1,\"views\":982},\"related\":[{\"slug\":\"pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-24T09:00:00.000Z\"},{\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Prestasi\",\"published_at\":\"2026-10-16T04:15:00.000Z\"},{\"slug\":\"bazar-umkm-konawe-bersahaja-2026\",\"title\":\"Bazar UMKM Konawe Bersahaja 2026 Catat Transaksi Rp1,4 Miliar\",\"image_url\":\"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-11T08:45:00.000Z\"}]}"},"/api/news/kdmp-wawotobi-predikat-koperasi-sehat":{"status":200,"body":"{\"data\":{\"id\":\"a7d33405-7f25-443f-b6a7-9a05e7e8e839\",\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"excerpt\":\"Penilaian kesehatan koperasi mencakup aspek permodalan, kualitas aset, manajemen, efisiensi, likuiditas, dan pertumbuhan usaha.\",\"content\":\"KDMP Tani Jaya Wawotobi meraih predikat Koperasi Sehat pada penilaian triwulan III 2026 yang dilakukan Dinkopukm Kabupaten Konawe.\\n\\nPenilaian dilakukan terhadap 152 KDMP aktif dengan indikator permodalan, kualitas aset produktif, manajemen, efisiensi, likuiditas, pertumbuhan usaha, dan kepatuhan pelaporan RAT.\\n\\nKetua KDMP Tani Jaya Wawotobi menyampaikan bahwa capaian ini tidak lepas dari disiplin pencatatan keuangan dan keterlibatan anggota dalam pengawasan. \\\"Setiap bulan kami publikasikan laporan simpanan dan penjualan saprodi di microsite koperasi,\\\" katanya.\\n\\nDinkopukm mendorong seluruh KDMP mencontoh praktik baik ini, khususnya keterbukaan laporan melalui microsite yang dapat diakses masyarakat.\",\"category\":\"Prestasi\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Humas Dinkopukm Konawe\",\"published_at\":\"2026-10-16T04:15:00.000Z\",\"is_published\":1,\"views\":301},\"related\":[{\"slug\":\"pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-24T09:00:00.000Z\"},{\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Pengumuman\",\"published_at\":\"2026-10-20T02:30:00.000Z\"},{\"slug\":\"bazar-umkm-konawe-bersahaja-2026\",\"title\":\"Bazar UMKM Konawe Bersahaja 2026 Catat Transaksi Rp1,4 Miliar\",\"image_url\":\"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-11T08:45:00.000Z\"}]}"},"/api/news/bazar-umkm-konawe-bersahaja-2026":{"status":200,"body":"{\"data\":{\"id\":\"8130bd0c-ff60-4917-9f30-5fab0e43bd60\",\"slug\":\"bazar-umkm-konawe-bersahaja-2026\",\"title\":\"Bazar UMKM Konawe Bersahaja 2026 Catat Transaksi Rp1,4 Miliar\",\"excerpt\":\"Sebanyak 120 UMKM binaan Dinkopukm Konawe terlibat dalam bazar yang digelar selama lima hari di Alun-Alun Unaaha.\",\"content\":\"Bazar UMKM Konawe Bersahaja 2026 yang digelar di Alun-Alun Unaaha selama lima hari mencatat transaksi sebesar Rp1,4 miliar.\\n\\nSebanyak 120 UMKM binaan mengisi 60 tenant, mencakup produk kuliner, kriya, fesyen, hingga olahan perkebunan. Selain transaksi langsung, kegiatan ini menghadirkan business matching dengan tiga marketplace nasional dan dua perbankan.\\n\\n\\\"Kami memastikan UMKM tidak hanya ramai saat bazar, tetapi juga mendapat pembeli berulang lewat katalog digital dan pendampingan pemasaran,\\\" ujar Kepala Bidang UKM.\\n\\nDinkopukm menargetkan 200 UMKM naik kelas pada 2026 melalui kombinasi pelatihan, sertifikasi, dan akses pembiayaan.\",\"category\":\"Kegiatan\",\"image_url\":\"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Bidang UKM\",\"published_at\":\"2026-10-11T08:45:00.000Z\",\"is_published\":1,\"views\":548},\"related\":[{\"slug\":\"pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-24T09:00:00.000Z\"},{\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Pengumuman\",\"published_at\":\"2026-10-20T02:30:00.000Z\"},{\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Prestasi\",\"published_at\":\"2026-10-16T04:15:00.000Z\"}]}"},"/api/news/target-100-persen-koperasi-lapor-rat-2026":{"status":200,"body":"{\"data\":{\"id\":\"39a68348-7106-4872-97a4-dedc7f3042d3\",\"slug\":\"target-100-persen-koperasi-lapor-rat-2026\",\"title\":\"Pemkab Konawe Targetkan 100 Persen Koperasi Aktif Laporkan RAT 2026\",\"excerpt\":\"Layanan Lapor RAT hadir untuk mempermudah koperasi menyampaikan dokumen Rapat Anggota Tahunan secara daring dan terverifikasi.\",\"content\":\"Pemerintah Kabupaten Konawe menargetkan seluruh koperasi aktif menyampaikan laporan Rapat Anggota Tahunan (RAT) tahun buku 2025 secara tepat waktu pada 2026.\\n\\nMelalui menu Lapor RAT pada portal ini, pengurus koperasi dapat mengunggah ringkasan hasil RAT, tanggal pelaksanaan, serta tautan dokumen laporan keuangan yang telah disahkan.\\n\\n\\\"Kepatuhan RAT adalah indikator utama kesehatan koperasi. Lewat layanan digital ini, verifikasi bisa dilakukan lebih cepat dan data capaian dapat dipantau per kecamatan,\\\" jelas Kepala Dinkopukm Konawe.\\n\\nHingga Oktober 2026, 78 persen koperasi aktif di Konawe telah melaporkan RAT. Koperasi yang belum melapor diimbau segera melengkapi melalui akun pengurus yang terdaftar.\",\"category\":\"Pengumuman\",\"image_url\":\"https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Bidang Koperasi\",\"published_at\":\"2026-10-06T01:00:00.000Z\",\"is_published\":1,\"views\":735},\"related\":[{\"slug\":\"pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-24T09:00:00.000Z\"},{\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Pengumuman\",\"published_at\":\"2026-10-20T02:30:00.000Z\"},{\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Prestasi\",\"published_at\":\"2026-10-16T04:15:00.000Z\"}]}"},"/api/news/sinergi-dinkopukm-bri-kur-umkm-konawe":{"status":200,"body":"{\"data\":{\"id\":\"da320b71-3903-4c59-b0b5-4f8bf02c303b\",\"slug\":\"sinergi-dinkopukm-bri-kur-umkm-konawe\",\"title\":\"Sinergi Dinkopukm Konawe dan BRI Salurkan KUR Rp12 Miliar untuk UMKM\",\"excerpt\":\"Penyaluran kredit usaha rakyat menyasar UMKM binaan yang telah memiliki legalitas dan sertifikasi produk.\",\"content\":\"Dinkopukm Kabupaten Konawe bersama BRI menyalurkan Kredit Usaha Rakyat (KUR) senilai Rp12,4 miliar kepada 640 pelaku UMKM hingga September 2026.\\n\\nPenyaluran diprioritaskan bagi UMKM yang telah terdata pada layanan Daftar UMKM Yuk! dan memiliki legalitas usaha. Skema ini memudahkan bank melakukan penilaian kelayakan karena data usaha telah terverifikasi.\\n\\nDinkopukm juga menyelenggarakan pendampingan penyusunan laporan keuangan sederhana sebagai syarat pengajuan kredit, dengan 12 kelas yang diikuti 480 peserta.\\n\\nPelaku UMKM yang ingin mengakses pembiayaan dapat mendaftarkan usahanya terlebih dahulu melalui portal ini, kemudian menghubungi pendamping kecamatan.\",\"category\":\"Program\",\"image_url\":\"https://images.unsplash.com/photo-1554224154-26032ffc0d07?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Humas Dinkopukm Konawe\",\"published_at\":\"2026-09-28T03:20:00.000Z\",\"is_published\":1,\"views\":403},\"related\":[{\"slug\":\"pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-24T09:00:00.000Z\"},{\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Pengumuman\",\"published_at\":\"2026-10-20T02:30:00.000Z\"},{\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Prestasi\",\"published_at\":\"2026-10-16T04:15:00.000Z\"}]}"},"/api/news/direktori-kdmp-terintegrasi-microsite":{"status":200,"body":"{\"data\":{\"id\":\"93ee91c5-24b7-4c4c-956f-7e6a81f954bc\",\"slug\":\"direktori-kdmp-terintegrasi-microsite\",\"title\":\"Direktori Koperasi Merah Putih Konawe Kini Terintegrasi Microsite\",\"excerpt\":\"Masyarakat dapat menelusuri profil, bidang usaha, dan tautan microsite 152 KDMP dalam satu direktori terbuka.\",\"content\":\"Dinkopukm Kabupaten Konawe meluncurkan pembaruan Direktori Koperasi Desa/Kelurahan Merah Putih (KDMP) yang kini menampilkan tautan microsite pada setiap profil koperasi.\\n\\nDirektori memuat nama KDKMP, desa/kelurahan, kecamatan, bidang usaha, serta alamat microsite resmi. Data dapat ditelusuri berdasarkan kecamatan maupun kata kunci bidang usaha.\\n\\n\\\"Keterbukaan informasi adalah kunci kepercayaan anggota. Dengan microsite, masyarakat bisa melihat unit usaha dan aktivitas koperasi tanpa harus datang ke kantor desa,\\\" terang Kepala Dinkopukm.\\n\\nPembaruan data dilakukan secara berkala oleh admin melalui template Excel yang sama dengan format direktori, sehingga proses pemutakhiran menjadi lebih cepat dan seragam.\",\"category\":\"Program\",\"image_url\":\"https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Tim Transformasi Digital\",\"published_at\":\"2026-09-19T06:00:00.000Z\",\"is_published\":1,\"views\":470},\"related\" daklanjuti maksimal 14 hari kerja dengan status: baru, diverifikasi, diproses, dan selesai.\",\"category\":\"Pengumuman\",\"image_url\":\"https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1200&q=70\",\"author\":\"Bidang Koperasi\",\"published_at\":\"2026-09-12T02:00:00.000Z\",\"is_published\":1,\"views\":626},\"related\":[{\"slug\":\"pelatihan-digitalisasi-koperasi-merah-putih-angkatan-iii\",\"title\":\"Dinkopukm Konawe Gelar Pelatihan Digitalisasi Koperasi Merah Putih Angkatan III\",\"image_url\":\"https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Kegiatan\",\"published_at\":\"2026-10-24T09:00:00.000Z\"},{\"slug\":\"pendaftaran-sertifikasi-halal-gratis-umkm-konawe\",\"title\":\"Pendaftaran Sertifikasi Halal Gratis untuk UMKM Konawe Dibuka hingga 30 November\",\"image_url\":\"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Pengumuman\",\"published_at\":\"2026-10-20T02:30:00.000Z\"},{\"slug\":\"kdmp-wawotobi-predikat-koperasi-sehat\",\"title\":\"KDMP Tani Jaya Wawotobi Raih Predikat Koperasi Sehat Triwulan III 2026\",\"image_url\":\"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=70\",\"category\":\"Prestasi\",\"published_at\":\"2026-10-16T04:15:00.000Z\"}]}"},"/api/kdmp/kdmp-amonggedo-jaya":{"status":200,"body":"{\"data\":{\"id\":\"20820b78-01a5-4777-9d64-a007714d6289\",\"slug\":\"kdmp-amonggedo-jaya\",\"nama_kdkmp\":\"KDMP Amonggedo Jaya\",\"desa_kel\":\"Desa Amonggedo\",\"kecamatan\":\"Amonggedo\",\"bidang_usaha\":\"Perdagangan Sembako & Jasa Angkutan\",\"alamat_microsite\":\"https://kdkmp-amonggedo-jaya.konawekab.go.id\",\"ketua\":\"Sitti Rahmawati\",\"jumlah_anggota\":76,\"tahun_berdiri\":2025,\"status\":\"Aktif\",\"deskripsi\":\"Melayani distribusi sembako desa dan jasa angkutan hasil pertanian antar kecamatan.\",\"kontak\":\"0812 4455 1010\",\"created_at\":\"2026-10-29
