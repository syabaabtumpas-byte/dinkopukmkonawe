<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05100c" />
    <meta
      name="description"
      content="Portal Layanan Digital Dinas Koperasi & UKM Kabupaten Konawe — Daftar UMKM, Pendirian Koperasi, Direktori Koperasi Merah Putih, Lapor RAT, MERPATI, dan PASTI UMKM."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>DINKOPUKM Kabupaten Konawe — Layanan Publik Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Dibuka langsung dari komputer (file:// tanpa server): modul TSX tidak bisa
      dijalankan browser, jadi kita tampilkan pratinjau mandiri di preview/index.html.
      Saat situs disajikan lewat server (http/https) blok ini tidak melakukan apa-apa.
    -->
    <script>
      if (location.protocol === "file:") {
        document.title = "DINKOPUKM Kabupaten Konawe — Pratinjau Website";
        document.body.style.cssText = "margin:0;background:#05100c";
        var frame = document.createElement("iframe");
        frame.src = "preview/index.html";
        frame.title = "Pratinjau website DINKOPUKM Kabupaten Konawe";
        frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;display:block";
        document.body.appendChild(frame);
      }
    </script>
  </body>
</html>
